<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
</head>
<body>

    <img src="imagenes/logotransp.png" alt="Logo majoca">
    <h2>Iniciar sesión</h2>

    <form action="#" method="post">
        <label for="email">Correo electrónico</label><br>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required><br><br>

        <label for="password">Contraseña</label><br>
        <input type="password" id="password" name="password" placeholder="********" required><br><br>

        <button type="submit">Entrar</button>
    </form>
</body>
</html>

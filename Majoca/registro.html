<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <h2>Registrarse</h2>

    <form action="#" method="post">
        <label for="nombre">Nombre</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required><br><br>

        <label for="email">Correo electrónico</label><br>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required><br><br>

        <label for="password">Contraseña</label><br>
        <input type="password" id="password" name="password" placeholder="********" required><br><br>

        <label for="confirm-password">Confirmar contraseña</label><br>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="********" required><br><br>

        <button type="submit">Registrarse</button>
    </form>
</body>
</html>
